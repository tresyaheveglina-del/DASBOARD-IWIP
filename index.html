<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRD Management System</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172b4d;background:#edf3fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:82px;background:linear-gradient(105deg,#fff 0%,#e8f4ff 57%,#064a9e 100%);display:flex;align-items:center;justify-content:space-between;padding:12px 25px;border-bottom:3px solid #0b65d8}.brand{display:flex;align-items:center;gap:14px}.logo{font-size:35px;font-weight:900;letter-spacing:-3px;color:#e8a000;text-shadow:1px 1px #d42b28}.brand small{display:block;color:#0644a0;font-weight:bold}.user{color:#fff;text-align:right;font-weight:bold}.shell{display:flex;min-height:calc(100vh - 82px)}aside{width:235px;flex-shrink:0;background:linear-gradient(#071d51,#082d72);padding:15px 9px;color:white}aside button{width:100%;text-align:left;background:none;border:0;color:#e8f1ff;padding:12px 13px;margin:2px 0;border-radius:7px}aside button:hover,aside button.active{background:#0868e9}main{padding:22px;flex:1;min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:24px;margin:0}h2{font-size:18px;color:#0952b9;margin:0 0 14px}.muted{color:#66748d;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:13px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid #c9dbf4;border-radius:12px;padding:18px;box-shadow:0 2px 6px #1235a010}.card strong{font-size:29px;color:#0b58bc;display:block;margin-top:10px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.btn{border:0;border-radius:7px;background:#0961d5;color:white;padding:10px 14px;font-weight:600}.btn.alt{background:#e7f0ff;color:#0b51a8}.btn.red{background:#c93648}.btn.green{background:#128454}.btn:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{padding:10px;border:1px solid #bfcde0;border-radius:7px;background:white;max-width:100%}.toolbar input{min-width:220px;flex:1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e3ebf5;padding:11px;text-align:left;white-space:nowrap}th{background:#e9f2ff;color:#104b9d}tr:hover td{background:#f8fbff}.pill{border-radius:20px;padding:5px 9px;font-size:12px;background:#eaf1fb;color:#19509a;display:inline-block}.pill.ok{background:#d9f7e7;color:#136d3e}.pill.bad{background:#ffe4e8;color:#a51b34}.pill.warn{background:#fff2c7;color:#886000}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.details div{padding:8px;border-bottom:1px solid #e7edf7}.details b{display:block;font-size:12px;color:#64748b;margin-bottom:5px}.steps{display:flex;gap:8px;flex-wrap:wrap}.step{padding:12px;border:1px solid #d1dced;border-radius:9px;background:#f7faff;flex:1;min-width:105px;text-align:center}.step.done{background:#dff5e7;border-color:#8ed7a9}.step.current{background:#fff0c5;border-color:#efc65a}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}.field input,.field select,.field textarea{width:100%}.modalbg{position:fixed;inset:0;background:#071a3b9c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:#fff;border-radius:12px;padding:22px;width:min(780px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.hidden{display:none!important}.notice{background:#fff6d9;border:1px solid #f2d582;border-radius:8px;padding:10px 13px;margin-bottom:15px;font-size:13px}.empty{text-align:center;padding:35px;color:#64748b}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checklist label{display:flex;gap:7px;align-items:center;padding:9px;background:#f5f8fe;border-radius:7px}.checklist input{width:17px;height:17px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{padding:6px 9px;font-size:12px}.footer{margin-top:20px;color:#6a7790;font-size:12px}@media(max-width:850px){aside{width:66px}aside button{font-size:0}aside button span{font-size:22px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.user{display:none}}@media(max-width:520px){.top{height:auto}.brand{font-size:12px}.logo{font-size:28px}main{padding:12px}.cards{grid-template-columns:1fr 1fr}.formgrid,.details,.checklist{grid-template-columns:1fr}h1{font-size:20px}}@media print{aside,.top,.toolbar,.actions,.btn,.notice{display:none!important}main{padding:0}.panel{box-shadow:none}body{background:white}}

.top{position:sticky;top:0;z-index:5}.avatar{width:84px;height:100px;object-fit:cover;border-radius:9px;border:1px solid #bdd0ec;background:#e7eef9}.miniavatar{width:34px;height:34px;border-radius:50%;object-fit:cover}.profile{display:flex;gap:16px;align-items:center}.field textarea{min-height:65px}.sectiontitle{font-size:14px;font-weight:700;color:#1251a6;margin:18px 0 10px}.logoimg{max-height:48px;max-width:95px;object-fit:contain}.filelabel{display:inline-flex;align-items:center;gap:8px}.filelabel input{max-width:230px}.top .user{font-size:13px}.smallbtn{font-size:12px;padding:7px 9px}.hint{font-size:12px;color:#64748b}.alert{background:#eaf4ff;padding:10px;border-radius:8px;margin-bottom:12px}.pill{white-space:nowrap}@media(max-width:850px){aside{width:170px}aside button{font-size:12px}aside button span{font-size:18px}}@media(max-width:580px){aside{width:58px}aside button{font-size:0}aside button span{font-size:19px}.top .brand b{font-size:11px}.top .brand small{font-size:10px}}
</style></head><body><header class="top"><div class="brand"><img id="brandLogo" class="logoimg hidden" alt="Logo organisasi"><div id="brandText" class="logo">HRD</div><div><b id="orgName">HRD MANAGEMENT SYSTEM</b><small id="systemName">RECRUITMENT & EMPLOYEE MANAGEMENT</small></div></div><div class="user"><span id="operatorName">Christian El Beny Tidore</span><br><small id="operatorRole">Operator Admin HRD</small></div></header><div class="shell"><aside id="nav"></aside><main><div id="app"></div><div class="footer">Sistem pengelolaan HRD mandiri • Penyimpanan lokal perangkat • Tidak terhubung dengan portal rekrutmen eksternal.</div></main></div><div id="overlay" class="modalbg hidden"><div class="modal" id="modal"></div></div><script>
const KEY='hrd-management-full-v2';
const DEPS=['Mining','Ferronickel','Hydrometallurgy','Battery Plant','Power Plant','Engineering','Logistik','Port','HSE','HRD','ACC-ID','ACC-EXP','HAN','WMC','Legal','Translator'];
const STAGES=['Registrasi','Tes User','Wawancara HR & User','Psikotes','MCU','Hasil Akhir'];
const DOCS=['KTP','Kartu Keluarga','Ijazah Terakhir','Transkrip Nilai','NPWP','Surat Lamaran','CV','SKCK','Pas Foto','Dokumen Pendukung'];
const NAV=[['🏠','Dashboard'],['👥','Data Karyawan'],['📋','Rekrutmen'],['🏥','Medical Check Up'],['📄','Kontrak Kerja'],['📅','Absensi'],['📊','Penilaian Kinerja'],['📍','Penempatan'],['🗂️','Dokumen'],['📈','Laporan'],['⚙️','Pengaturan']];
const blank=()=>({people:[],attendance:[],reviews:[],settings:{org:'HRD MANAGEMENT SYSTEM',system:'RECRUITMENT & EMPLOYEE MANAGEMENT',operator:'Christian El Beny Tidore',role:'Operator Admin HRD',logo:''}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){db=blank()};db={...blank(),...db};
let page='Dashboard',selected='',q='',f='Semua';
const $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Penyimpanan browser penuh. Gunakan foto berukuran kecil dan ekspor cadangan JSON.')}};
const person=id=>db.people.find(p=>p.id===id);
const date=()=>new Date().toISOString().slice(0,10);
const opts=(items,v)=>items.map(s=>`<option value="${esc(s)}" ${s===v?'selected':''}>${esc(s)}</option>`).join('');
const btn=(label,act,cls='')=>`<button class="btn ${cls}" onclick="${act}">${label}</button>`;
const pill=v=>`<span class="pill ${['Diterima','Hadir','Lulus','Layak','Aktif'].includes(v)?'ok':['Ditolak','Tidak Hadir','Tidak Layak','PHK'].includes(v)?'bad':'warn'}">${esc(v||'Belum Tersedia')}</span>`;
function header(t,actions=''){return `<div class="heading"><h1>${esc(t)}</h1><div class="actions">${actions}</div></div>`}
function card(t,v){return `<div class="card"><span class="muted">${t}</span><strong>${v}</strong></div>`}
function render(){ $('nav').innerHTML=NAV.map(([icon,name])=>`<button class="${page===name?'active':''}" onclick="go('${name}')"><span>${icon}</span> ${name}</button>`).join('');$('orgName').textContent=db.settings.org;$('systemName').textContent=db.settings.system;$('operatorName').textContent=db.settings.operator;$('operatorRole').textContent=db.settings.role;$('brandLogo').classList.toggle('hidden',!db.settings.logo);$('brandText').classList.toggle('hidden',!!db.settings.logo);if(db.settings.logo)$('brandLogo').src=db.settings.logo;let html='';if(selected&&person(selected))html=detail(person(selected));else{selected='';if(page==='Dashboard')html=dashboard();else if(page==='Rekrutmen'||page==='Data Karyawan')html=peopleView();else if(page==='Absensi')html=attendanceView();else if(page==='Penilaian Kinerja')html=reviewView();else if(page==='Pengaturan')html=settingsView();else if(page==='Laporan')html=reportsView();else html=moduleView()}$('app').innerHTML=html}
function go(p){page=p;selected='';q='';f='Semua';render()}
function dashboard(){let p=db.people;return header('Dashboard HRD',btn('+ Tambah Calon Karyawan','openPerson()'))+`<div class="cards">${card('Total Calon Karyawan',p.length)}${card('Dalam Seleksi',p.filter(x=>['Baru','Proses Seleksi'].includes(x.status)).length)}${card('Diterima',p.filter(x=>x.status==='Diterima').length)}${card('Ditolak',p.filter(x=>x.status==='Ditolak').length)}</div><div class="grid2"><section class="panel"><h2>Tahapan Rekrutmen</h2>${STAGES.map((s,i)=>`<p>${s}<b style="float:right">${p.filter(x=>+x.stage===i).length}</b></p>`).join('')}</section><section class="panel"><h2>Akses Cepat</h2><div class="actions">${btn('Kelola Rekrutmen',"go('Rekrutmen')")}${btn('Absensi',"go('Absensi')",'alt')}${btn('Penilaian Kinerja',"go('Penilaian Kinerja')",'alt')}${btn('Laporan',"go('Laporan')",'alt')}</div><p class="muted">Gunakan menu samping untuk membuka seluruh fitur administrasi.</p></section></div>`}
function filtered(){return db.people.filter(p=>(page!=='Data Karyawan'||p.status==='Diterima')&&[p.name,p.nik,p.id,p.department,p.position].join(' ').toLowerCase().includes(q.toLowerCase())&&(f==='Semua'||p.status===f))}
function peopleView(){return header(page,btn('+ Tambah Calon Karyawan','openPerson()')+btn('Ekspor CSV','exportCSV()','alt'))+`<section class="panel"><div class="toolbar"><input id="search" placeholder="Cari nama, NIK, departemen..." value="${esc(q)}" oninput="q=this.value;refreshRows()"><select onchange="f=this.value;refreshRows()">${opts(['Semua','Baru','Proses Seleksi','Diterima','Ditolak'],f)}</select></div><div class="tablewrap" id="rows">${personRows(filtered())}</div></section>`}
function refreshRows(){$('rows').innerHTML=personRows(filtered())}
function personRows(arr){return arr.length?`<table><thead><tr><th>Foto</th><th>ID</th><th>Nama</th><th>NIK</th><th>Departemen</th><th>Posisi</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${arr.map(p=>`<tr><td>${p.photo?`<img class="miniavatar" src="${p.photo}">`:'👤'}</td><td>${esc(p.id)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.nik)}</td><td>${esc(p.department)}</td><td>${esc(p.position)}</td><td>${pill(p.status)}</td><td><div class="actions">${btn('Detail',`view('${p.id}')`)}${btn('Edit',`openPerson('${p.id}')`,'alt')}</div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Belum ada data. Tambahkan calon karyawan untuk memulai.</div>'}
function view(id){selected=id;render()}
const detailField=(label,val)=>`<div><b>${label}</b>${esc(val||'-')}</div>`;
function detail(p){return header('Detail Calon Karyawan',btn('← Kembali',"selected='';render()",'alt')+btn('Cetak','window.print()')+btn('Edit',`openPerson('${p.id}')`,'alt'))+`<div class="grid2"><section class="panel"><div class="profile">${p.photo?`<img class="avatar" src="${p.photo}">`:'<div class="avatar" style="display:grid;place-items:center;font-size:40px">👤</div>'}<div><h2>${esc(p.name)}</h2>${pill(p.status)}<p class="muted">${esc(p.id)}</p></div></div><div class="details">${[['NIK',p.nik],['Tempat Lahir',p.birthplace],['Tanggal Lahir',p.birthdate],['Jenis Kelamin',p.gender],['Agama',p.religion],['Status Perkawinan',p.marital],['Alamat',p.address],['No. HP',p.phone],['Email',p.email],['Pendidikan',p.education],['Jurusan',p.major],['Perguruan Tinggi',p.university],['Pengalaman Kerja',p.experience]].map(a=>detailField(...a)).join('')}</div></section><section class="panel"><h2>Informasi Rekrutmen</h2><div class="details">${[['Departemen',p.department],['Jabatan',p.position],['Lokasi',p.location],['Tanggal Melamar',p.applied],['Tahap',STAGES[p.stage||0]],['Status',p.status],['Hasil MCU',p.mcu],['Kontrak',p.contract],['Status Karyawan',p.employment]].map(a=>detailField(...a)).join('')}</div><div class="sectiontitle">Ubah Status</div><div class="actions">${btn('Lanjut Tahap',`advance('${p.id}')`)}${btn('Terima',`status('${p.id}','Diterima')`,'green')}${btn('Tolak',`status('${p.id}','Ditolak')`,'red')}${btn('Proses Seleksi',`status('${p.id}','Proses Seleksi')`,'alt')}</div></section></div><section class="panel" style="margin-top:15px"><h2>Tahapan Rekrutmen</h2><div class="steps">${STAGES.map((s,i)=>`<div class="step ${i<(p.stage||0)?'done':i===(p.stage||0)?'current':''}">${i<(p.stage||0)?'✓ ':''}${s}</div>`).join('')}</div></section><div class="grid2" style="margin-top:15px"><section class="panel"><h2>Dokumen Administrasi</h2><div class="checklist">${DOCS.map(d=>`<label><input type="checkbox" ${p.docs?.[d]?'checked':''} onchange="checkDoc('${p.id}','${d}',this.checked)">${d}</label>`).join('')}</div><div class="sectiontitle">Unggah Berkas</div><input type="file" accept="image/*,.pdf" onchange="uploadDoc('${p.id}',this)"><div class="hint">Berkas disimpan dalam browser, kapasitas terbatas.</div><div>${Object.keys(p.files||{}).map(n=>`<p>📎 ${esc(n)} ${btn('Lihat',`showFile('${p.id}','${encodeURIComponent(n)}')`,'alt smallbtn')}${btn('Hapus',`deleteFile('${p.id}','${encodeURIComponent(n)}')`,'red smallbtn')}</p>`).join('')}</div></section><section class="panel"><h2>Penempatan & Administrasi</h2><div class="formgrid"><label class="field">Departemen<select id="dep">${opts(DEPS,p.department)}</select></label><label class="field">Jabatan<input id="position" value="${esc(p.position)}"></label><label class="field">Lokasi Kerja<input id="location" value="${esc(p.location)}"></label><label class="field">MCU<select id="mcu">${opts(['Belum Diperiksa','Layak','Tidak Layak','Perlu Pemeriksaan Lanjutan'],p.mcu)}</select></label><label class="field">Kontrak<select id="contract">${opts(['Belum Dibuat','Draft','Aktif','Berakhir'],p.contract)}</select></label><label class="field">Status Karyawan<select id="employment">${opts(['Belum Aktif','Aktif','Cuti','Resign','PHK'],p.employment)}</select></label><label class="field">Mulai Kontrak<input type="date" id="contractStart" value="${esc(p.contractStart)}"></label><label class="field">Akhir Kontrak<input type="date" id="contractEnd" value="${esc(p.contractEnd)}"></label></div><div style="margin-top:12px">${btn('Simpan Perubahan',`saveAdmin('${p.id}')`)}</div></section></div><section class="panel" style="margin-top:15px">${btn('Hapus Calon Karyawan',`removePerson('${p.id}')`,'red')}</section>`}
function advance(id){let p=person(id);if(p.stage<STAGES.length-1){p.stage++;p.status='Proses Seleksi';save();render()}else alert('Tahap terakhir telah dicapai.')}
function status(id,v){if(!confirm('Ubah status menjadi '+v+'?'))return;let p=person(id);p.status=v;if(v==='Diterima'){p.stage=5;p.employment='Aktif'}save();render()}
function saveAdmin(id){let p=person(id);['department','position','location','mcu','contract','employment','contractStart','contractEnd'].forEach(k=>p[k==="department"?"department":k]=$(k==='department'?'dep':k).value);save();render();alert('Perubahan tersimpan.')}
function checkDoc(id,n,v){person(id).docs[n]=v;save()}
function removePerson(id){if(confirm('Hapus data dan seluruh catatan terkait?')){db.people=db.people.filter(p=>p.id!==id);db.attendance=db.attendance.filter(a=>a.personId!==id);db.reviews=db.reviews.filter(a=>a.personId!==id);selected='';save();render()}}
function modal(content){$('overlay').classList.remove('hidden');$('modal').innerHTML=content}
function closeModal(){$('overlay').classList.add('hidden')}
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};
const personFields=[['name','Nama Lengkap','text'],['nik','NIK','text'],['birthplace','Tempat Lahir','text'],['birthdate','Tanggal Lahir','date'],['gender','Jenis Kelamin','select',['Laki-laki','Perempuan']],['religion','Agama','text'],['marital','Status Perkawinan','select',['Belum Kawin','Kawin','Cerai']],['address','Alamat','textarea'],['phone','Nomor HP','text'],['email','Email','email'],['education','Pendidikan','text'],['university','Perguruan Tinggi / Sekolah','text'],['major','Jurusan','text'],['experience','Pengalaman Kerja','textarea'],['department','Departemen','select',DEPS],['position','Jabatan Dilamar','text'],['location','Lokasi Kerja','text'],['applied','Tanggal Melamar','date']];
function openPerson(id){let p=person(id)||{};modal(`<div class="modalhead"><h2>${id?'Edit Data':'Tambah Calon Karyawan'}</h2>${btn('✕ Tutup','closeModal()','alt')}</div><form id="personForm"><div class="formgrid">${personFields.map(([k,label,type,values])=>`<label class="field">${label}${type==='select'?`<select name="${k}">${opts(values,p[k])}</select>`:type==='textarea'?`<textarea name="${k}">${esc(p[k])}</textarea>`:`<input name="${k}" type="${type}" value="${esc(p[k]||(k==='applied'?date():''))}" ${k==='name'?'required':''}>`}</label>`).join('')}</div><div class="sectiontitle">Foto Calon Karyawan</div><input id="photoInput" type="file" accept="image/*"><p class="hint">Unggah JPG/PNG; foto akan dikompresi agar hemat penyimpanan.</p><div class="toolbar" style="margin-top:18px"><button type="submit" class="btn">Simpan Data</button>${btn('Batal','closeModal()','alt')}</div></form>`);$('personForm').onsubmit=async e=>{e.preventDefault();let fields=Object.fromEntries(new FormData(e.target).entries());let record=id?person(id):{id:'HR-'+Date.now().toString(36).toUpperCase(),stage:0,status:'Baru',docs:{},files:{},mcu:'Belum Diperiksa',contract:'Belum Dibuat',employment:'Belum Aktif'};Object.assign(record,fields);let file=$('photoInput').files[0];if(file){try{record.photo=await compress(file)}catch(err){alert('Foto gagal dibaca: '+err.message);return}}if(!id)db.people.unshift(record);save();closeModal();selected=record.id;render()}}
function compress(file){return new Promise((resolve,reject)=>{if(file.size>15e6)return reject(Error('Ukuran foto maksimal 15 MB'));let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let scale=Math.min(1,450/img.width,450/img.height);c.width=Math.max(1,img.width*scale);c.height=Math.max(1,img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=()=>reject(Error('Format gambar tidak didukung'));img.src=reader.result};reader.onerror=()=>reject(Error('Gagal membaca file'));reader.readAsDataURL(file)})}
function uploadDoc(id,input){let file=input.files[0];if(!file)return;if(file.size>1.5e6){alert('Berkas maksimal 1,5 MB untuk penyimpanan browser.');return}let reader=new FileReader();reader.onload=()=>{let p=person(id);p.files=p.files||{};p.files[file.name]=reader.result;save();render()};reader.readAsDataURL(file)}
function showFile(id,n){let file=person(id).files[decodeURIComponent(n)];if(file){let a=document.createElement('a');a.href=file;a.download=decodeURIComponent(n);a.click()}}
function deleteFile(id,n){delete person(id).files[decodeURIComponent(n)];save();render()}
function moduleView(){let arr=page==='Penempatan'||page==='Kontrak Kerja'?db.people.filter(p=>p.status==='Diterima'):page==='Medical Check Up'?db.people.filter(p=>p.stage>=4):db.people;return header(page,btn('+ Tambah Calon Karyawan','openPerson()'))+`<section class="panel"><div class="toolbar"><input placeholder="Cari nama atau departemen" oninput="$('moduleRows').innerHTML=personRows(${JSON.stringify(arr.map(x=>x.id))}.map(person).filter(p=>p&&[p.name,p.department].join(' ').toLowerCase().includes(this.value.toLowerCase())))"></div><div class="tablewrap" id="moduleRows">${personRows(arr)}</div></section>`}
function attendanceView(){let people=db.people.filter(p=>p.status==='Diterima');return header('Absensi Karyawan',btn('+ Catat Absensi','openAttendance()')+btn('Ekspor CSV','exportAttendance()','alt'))+`<div class="cards">${card('Total Catatan',db.attendance.length)}${card('Hadir',db.attendance.filter(a=>a.status==='Hadir').length)}${card('Izin / Sakit',db.attendance.filter(a=>['Izin','Sakit'].includes(a.status)).length)}${card('Tidak Hadir',db.attendance.filter(a=>a.status==='Tidak Hadir').length)}</div><section class="panel"><h2>Riwayat Absensi</h2><div class="tablewrap"><table><tr><th>Tanggal</th><th>Nama</th><th>Jam Masuk</th><th>Jam Keluar</th><th>Status</th><th>Catatan</th><th>Aksi</th></tr>${db.attendance.map(a=>`<tr><td>${esc(a.day)}</td><td>${esc(person(a.personId)?.name||'Data dihapus')}</td><td>${esc(a.inTime)}</td><td>${esc(a.outTime)}</td><td>${pill(a.status)}</td><td>${esc(a.note)}</td><td>${btn('Edit',`openAttendance('${a.id}')`,'alt smallbtn')}${btn('Hapus',`deleteRecord('attendance','${a.id}')`,'red smallbtn')}</td></tr>`).join('')}</table></div>${!db.attendance.length?'<div class="empty">Belum ada catatan absensi.</div>':''}</section>`}
function openAttendance(id){let a=db.attendance.find(x=>x.id===id)||{};let people=db.people.filter(p=>p.status==='Diterima');if(!people.length){alert('Tambahkan calon karyawan berstatus Diterima terlebih dahulu.');return}modal(`<div class="modalhead"><h2>${id?'Edit':'Catat'} Absensi</h2>${btn('Tutup','closeModal()','alt')}</div><form id="recordForm"><div class="formgrid"><label class="field">Karyawan<select name="personId">${people.map(p=>`<option value="${p.id}" ${a.personId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">Tanggal<input type="date" name="day" value="${esc(a.day||date())}" required></label><label class="field">Jam Masuk<input type="time" name="inTime" value="${esc(a.inTime)}"></label><label class="field">Jam Keluar<input type="time" name="outTime" value="${esc(a.outTime)}"></label><label class="field">Status<select name="status">${opts(['Hadir','Izin','Sakit','Cuti','Tidak Hadir'],a.status)}</select></label><label class="field">Catatan<input name="note" value="${esc(a.note)}"></label></div><p><button class="btn" type="submit">Simpan Absensi</button></p></form>`);$('recordForm').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(id)Object.assign(a,obj);else db.attendance.unshift({id:'A'+Date.now(),...obj});save();closeModal();render()}}
function reviewView(){return header('Penilaian Kinerja',btn('+ Tambah Penilaian','openReview()'))+`<section class="panel"><h2>Riwayat Penilaian</h2><div class="tablewrap"><table><tr><th>Tanggal</th><th>Karyawan</th><th>Disiplin</th><th>Produktivitas</th><th>Kerja Sama</th><th>Rata-rata</th><th>Catatan</th><th>Aksi</th></tr>${db.reviews.map(r=>`<tr><td>${esc(r.day)}</td><td>${esc(person(r.personId)?.name||'Data dihapus')}</td><td>${r.discipline}</td><td>${r.productivity}</td><td>${r.teamwork}</td><td><b>${((+r.discipline + +r.productivity + +r.teamwork)/3).toFixed(1)}</b></td><td>${esc(r.note)}</td><td>${btn('Edit',`openReview('${r.id}')`,'alt smallbtn')}${btn('Hapus',`deleteRecord('reviews','${r.id}')`,'red smallbtn')}</td></tr>`).join('')}</table></div>${!db.reviews.length?'<div class="empty">Belum ada penilaian kinerja.</div>':''}</section>`}
function openReview(id){let r=db.reviews.find(x=>x.id===id)||{};let people=db.people.filter(p=>p.status==='Diterima');if(!people.length){alert('Belum ada karyawan diterima.');return}modal(`<div class="modalhead"><h2>Penilaian Kinerja</h2>${btn('Tutup','closeModal()','alt')}</div><form id="recordForm"><div class="formgrid"><label class="field">Karyawan<select name="personId">${people.map(p=>`<option value="${p.id}" ${r.personId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">Tanggal<input type="date" name="day" value="${esc(r.day||date())}"></label>${[['discipline','Disiplin'],['productivity','Produktivitas'],['teamwork','Kerja Sama']].map(([k,t])=>`<label class="field">${t} (1–100)<input type="number" min="1" max="100" required name="${k}" value="${esc(r[k]||80)}"></label>`).join('')}<label class="field">Catatan<textarea name="note">${esc(r.note)}</textarea></label></div><p><button class="btn" type="submit">Simpan Penilaian</button></p></form>`);$('recordForm').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(id)Object.assign(r,obj);else db.reviews.unshift({id:'R'+Date.now(),...obj});save();closeModal();render()}}
function deleteRecord(k,id){if(confirm('Hapus catatan ini?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}
function reportsView(){return header('Laporan HRD',btn('Ekspor Rekrutmen CSV','exportCSV()')+btn('Ekspor Absensi CSV','exportAttendance()','alt')+btn('Cetak','window.print()','alt'))+`<div class="cards">${card('Calon Karyawan',db.people.length)}${card('Karyawan Diterima',db.people.filter(p=>p.status==='Diterima').length)}${card('Catatan Absensi',db.attendance.length)}${card('Penilaian Kinerja',db.reviews.length)}</div><section class="panel"><h2>Rekap per Departemen</h2><div class="tablewrap"><table><tr><th>Departemen</th><th>Total</th><th>Diterima</th><th>Dalam Seleksi</th></tr>${DEPS.map(d=>`<tr><td>${d}</td><td>${db.people.filter(p=>p.department===d).length}</td><td>${db.people.filter(p=>p.department===d&&p.status==='Diterima').length}</td><td>${db.people.filter(p=>p.department===d&&p.status==='Proses Seleksi').length}</td></tr>`).join('')}</table></div></section>`}
function csv(rows,filename){let content='﻿'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download(new Blob([content],{type:'text/csv;charset=utf-8'}),filename)}
function exportCSV(){csv([['ID','Nama','NIK','Departemen','Jabatan','Tahap','Status','Email','Telepon'],...db.people.map(p=>[p.id,p.name,p.nik,p.department,p.position,STAGES[p.stage||0],p.status,p.email,p.phone])],'rekrutmen_hrd.csv')}
function exportAttendance(){csv([['Tanggal','Karyawan','Masuk','Keluar','Status','Catatan'],...db.attendance.map(a=>[a.day,person(a.personId)?.name,a.inTime,a.outTime,a.status,a.note])],'absensi_hrd.csv')}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settingsView(){let s=db.settings;return header('Pengaturan Sistem')+`<div class="grid2"><section class="panel"><h2>Identitas & Tampilan</h2><form id="settingsForm"><div class="field">Nama Organisasi<input name="org" value="${esc(s.org)}"></div><div class="field">Nama Sistem<input name="system" value="${esc(s.system)}"></div><div class="field">Nama Operator<input name="operator" value="${esc(s.operator)}"></div><div class="field">Jabatan Operator<input name="role" value="${esc(s.role)}"></div><div class="field">Logo Organisasi<input id="logoInput" type="file" accept="image/*"></div><div class="toolbar" style="margin-top:12px"><button type="submit" class="btn">Simpan Pengaturan</button>${btn('Hapus Logo',"db.settings.logo='';save();render()",'alt')}</div></form></section><section class="panel"><h2>Cadangan & Pemulihan</h2><p class="muted">Ekspor data JSON untuk memindahkan seluruh data, foto, dokumen, absensi, dan penilaian ke browser lain.</p><div class="toolbar">${btn('Unduh Cadangan JSON','backup()')}<label class="filelabel">Impor JSON <input type="file" accept="application/json,.json" onchange="restore(this)"></label></div><hr><h2>Pengelolaan Data</h2>${btn('Hapus Seluruh Data',"if(confirm('Yakin menghapus SEMUA data?')){db=blank();save();render()}",'red')}<p class="hint">Data disimpan di browser ini, bukan di server. Untuk akses multi-admin secara online diperlukan layanan server, database, dan autentikasi.</p></section></div>`+'';}
function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'cadangan_hrd_'+date()+'.json')}
function restore(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let value=JSON.parse(reader.result);if(!Array.isArray(value.people)||!Array.isArray(value.attendance)||!Array.isArray(value.reviews)||!value.settings)throw Error('Format cadangan tidak sesuai');if(!confirm('Ganti data saat ini dengan cadangan yang dipilih?'))return;db=value;save();render();alert('Cadangan berhasil dipulihkan')}catch(e){alert('Impor gagal: '+e.message)}};reader.readAsText(file)}
document.addEventListener('submit',async e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();Object.assign(db.settings,Object.fromEntries(new FormData(e.target)));let file=$('logoInput').files[0];if(file){try{db.settings.logo=await compress(file)}catch(err){alert(err.message);return}}save();render();alert('Pengaturan tersimpan')});
render();
</script></body></html>
